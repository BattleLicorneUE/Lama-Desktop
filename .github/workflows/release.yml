# Publie une version : `git tag v0.2.0 && git push origin v0.2.0`.
# Compile l'installeur Windows, le signe et le met dans une Release GitHub avec latest.json,
# que les applications installées lisent pour se mettre à jour.
name: Publier une version

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run check

      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lama Desktop ${{ github.ref_name }}"
          releaseBody: "Voir les changements ci-dessous. Les applications installées proposent la mise à jour toute seules."
          releaseDraft: false
          prerelease: false
