# Les actions sont épinglées sur un commit précis (Dependabot propose les mises à jour).
# Publie une version : `git tag v0.2.1 && git push origin v0.2.1`, ou lancer ce workflow à la main avec le nom du tag.
# Compile l'installeur Windows, le signe et le met dans une Release GitHub avec latest.json,
# que les applications installées lisent pour se mettre à jour.
name: Publier une version

on:
  push:
    tags: ["v*"]
  # Lancement à la main (Actions → Run workflow) : le tag est alors créé par la publication elle-même.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à publier (ex. v0.2.1), identique à celle de tauri.conf.json"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Environnement protégé : on peut y exiger une validation manuelle et y placer les secrets de signature.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run check

      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Lama Desktop ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Voir les changements ci-dessous. Les applications installées proposent la mise à jour toute seules."
          releaseDraft: false
          prerelease: false
