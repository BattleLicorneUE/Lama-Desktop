# Vérifie chaque push et chaque pull request (la publication, elle, se fait sur les tags : voir release.yml).
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Une nouvelle poussée annule la vérification en cours de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build

      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml
