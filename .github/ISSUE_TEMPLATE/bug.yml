name: Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Pour une faille de sécurité, n'utilise pas ce formulaire : voir la [politique de sécurité](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé ?
      description: Ce que tu attendais et ce qui est arrivé.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Comment le reproduire ?
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de Lama Desktop
      placeholder: "0.2.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Version de Windows
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: logs
    attributes:
      label: Messages d'erreur ou captures
      description: Retire tout secret ou donnée personnelle avant de coller.
